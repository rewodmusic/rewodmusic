<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/img/favicon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-192.png">

    <title>SONG</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="REWOD blends expressive violin, piano, and symphonic sound into cinematic worlds where classical depth meets modern emotion."/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet"/>
</head>

<body class="page-song">
    <!-- MOBILE HEADER -->
    <header class="m-header">
        <a class="m-logo" href="/" aria-label="Go to Home">
            <img src="/img/logo.png" alt="REWOD logo">
        </a>
        <button class="m-burger" id="mBurger" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <section class="hero hero--plain">
        <div class="hero-inner">
            <a href="/" class="logo-link">
                <img src="/img/logo.png" class="logo" alt="REWOD logo">
            </a>
        </div>
    </section>

    <!-- SONG -->
    <section class="latest-release">
        <div class="latest-cover">
            <img id="latestCover" alt="REWOD visual"/>
        </div>

        <div class="latest-title" id="latestTitle">REWOD – ...</div>
        <div class="latest-sub">Choose service</div>

        <div class="service-box" id="latestServices">
            <div class="service-row spotify">
                <img src="/linktree/linktree_spotify.svg" class="service-icon">
                <a class="service-btn" id="btnSpotify">Play</a>
            </div>
            <div class="service-row apple">
                <img src="/linktree/linktree_applemusic.svg" class="service-icon">
                <a class="service-btn" id="btnApple">Play</a>
            </div>
            <div class="service-row youtube">
                <img src="/linktree/linktree_youtube.svg" class="service-icon">
                <a class="service-btn" id="btnYouTube">Watch</a>
            </div>
            <div class="service-row mms">
                <img src="/linktree/linktree_mms.png" class="service-icon">
                <a class="service-btn" id="btnMMS">Buy</a>
            </div>
            <div class="service-row kofi">
                <img src="/linktree/linktree_kofi.png" class="service-icon">
                <a class="service-btn" id="btnKofi">Donate</a>
            </div>

            <div class="latest-descr" id="latestDescr" hidden>
                <div id="latestDescrText"></div>
                <img id="latestSignature">
            </div>
        </div>
    </section>

    <script src="/song/song.js"></script>
    <script src="/js/mobileMenu.js"></script>
</body>
</html>
