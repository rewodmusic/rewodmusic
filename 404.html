<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
        <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
        <link rel="icon" type="image/png" sizes="512x512" href="/img/favicon-512.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-192.png">
        <!-- Primary Meta -->
        <title>REWOD – Coming Soon</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="REWOD is preparing for its official launch. Subscribe to the newsletter to be notified when the website becomes available.">
        <!-- Open Graph -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://rewodmusic.com/">
        <meta property="og:title" content="REWOD – Coming Soon">
        <meta property="og:description" content="REWOD is coming soon. Subscribe to be notified about the official launch.">
        <meta property="og:image" content="https://rewodmusic.com/og-image.jpg">
        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="REWOD – Coming Soon">
        <meta name="twitter:description" content="Subscribe to be notified when REWOD officially launches.">
        <meta name="twitter:image" content="https://rewodmusic.com/og-image.jpg">
        <!-- Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200..900&display=swap" rel="stylesheet">
        <!-- Global CSS -->
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body class="upcoming-page rewod-coming-soon">
        <!-- DYNAMIC BACKGROUND -->
        <div class="upcoming-page-bg" id="upcomingPageBg" aria-hidden="true"></div>
        <!-- ==================================================
         COMING SOON CONTENT
         ================================================== -->
        <main class="upcoming-wrap">
            <div class="upcoming-inner" id="upcomingApp">
                <!-- EXISTING UPCOMING RELEASE -->
                <div class="upcoming-grid">
                    <div class="upcoming-cover">
                        <img id="upcomingCover" src="/img/upcoming.jpg" alt="Upcoming REWOD release cover">
                    </div>
                    <div class="upcoming-textbox">
                        <div class="upcoming-date" id="upcomingDate">—</div>
                        <div class="upcoming-artist" id="upcomingArtist">—</div>
                        <div class="upcoming-title" id="upcomingTitle">—</div>
                        <div class="upcoming-feat" id="upcomingFeat" style="display:none;"></div>
                    </div>
                </div>
                <!-- ==================================================
                 LAUNCH ANNOUNCEMENT
                 ================================================== -->
                <div class="rewod-launch-message">
                    <div class="upcoming-follow">
                        The REWOD website is currently undergoing
                        maintenance and is temporarily unavailable
                        as I prepare for the official launch.<br>
                        Subscribe to the newsletter to be among
                        the first to know when REWOD officially launches.
                    </div>
                </div>
                <!-- ==================================================
                 NEWSLETTER
                 ================================================== -->
                <div class="upcoming-newsletter-wrap" aria-label="Newsletter subscription">
                    <div class="upcoming-newsletter">
                        <form class="newsletter-form" id="newsletterForm" autocomplete="on" novalidate>
                            <input class="newsletter-input" id="newsletterEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Email" required>
                            <button class="btn-listen" id="newsletterBtn" type="submit">
                                SUBSCRIBE
</button>
                        </form>
                    </div>
                    <div class="newsletter-status" id="newsletterStatus" aria-live="polite"></div>
                </div>
            </div>
        </main>
        <!-- ==================================================
         EXISTING JAVASCRIPT
         ================================================== -->
        <!-- Upcoming release + dynamic background -->
        <script src="/js/upcoming.js"></script>
        <!-- Newsletter subscription -->
        <script src="/upcoming/newsletter.js"></script>
    </body>
</html>
